name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "LASTFM_API_KEY=${LASTFM_API_KEY}" > local.properties
        echo "LASTFM_SECRET=${LASTFM_SECRET}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${LISTEN_TOGETHER_SERVER:-https://broker.emqx.io:8883}" >> local.properties

        if [ -n "$KEYSTORE_BASE64" ]; then
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > musify-release.jks
          STORE_PASS="$KEYSTORE_PASSWORD"
          ALIAS="$KEY_ALIAS"
          KEY_PASS="$KEY_PASSWORD"
          keytool -list -keystore musify-release.jks -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null
        elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
          echo "::error::KEYSTORE_BASE64 secret is missing on main; refusing to sign release with an ephemeral keystore."
          exit 1
        else
          STORE_PASS="musifyrelease"
          ALIAS="musify"
          KEY_PASS="musifyrelease"
          keytool -genkeypair -v -keystore musify-release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Musify, OU=Mobile, O=Musify, L=Jakarta, S=ID, C=ID"
        fi

        {
          echo "storeFile=musify-release.jks"
          echo "storePassword=$STORE_PASS"
          echo "keyAlias=$ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew :shared:jvmTest :sharedUi:jvmTest testDevDebugUnitTest

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Verify Signed Prod Release APK
      run: |
        ls -lh app/build/outputs/apk/prod/release/*.apk
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1 || true)
        AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1 || true)
        ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -n1 || true)

        KS_FILE=$(grep '^storeFile=' keystore.properties | cut -d= -f2- || true)
        KS_ALIAS=$(grep '^keyAlias=' keystore.properties | cut -d= -f2- || true)
        export KS_PASS=$(grep '^storePassword=' keystore.properties | cut -d= -f2- || true)
        export KEY_PASS=$(grep '^keyPassword=' keystore.properties | cut -d= -f2- || true)

        for apk in \
          app/build/outputs/apk/prod/release/*.apk \
          tv/build/outputs/apk/prod/release/*.apk \
          wearos/build/outputs/apk/prod/release/*.apk
        do
          [ -f "$apk" ] || continue
          echo "=== Signing (v1+v2+v3) & Verifying $apk ==="
          if [ -n "$APKSIGNER" ] && [ -n "$KS_FILE" ] && [ -f "$KS_FILE" ]; then
            "$APKSIGNER" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$KS_FILE" \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              "$apk"
          fi

          unzip -tqq "$apk"
          unzip -l "$apk" | grep -q "resources.arsc"
          unzip -l "$apk" | grep -q "AndroidManifest.xml"
          unzip -l "$apk" | grep -qE "classes[0-9]*\.dex"

          if [ -n "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -P 16 4 "$apk" || "$ZIPALIGN" -c 4 "$apk"
          fi

          if [ -n "$APKSIGNER" ]; then
            unzip -l "$apk" | grep -qE "META-INF/.*\.(RSA|DSA|EC)"
            VERIFY_OUT=$("$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$apk")
            echo "$VERIFY_OUT"
            echo "$VERIFY_OUT" | grep -qE "Verified using v1 scheme.*: true"
            echo "$VERIFY_OUT" | grep -qE "Verified using v2 scheme.*: true"
            echo "$VERIFY_OUT" | grep -qE "Verified using v3 scheme.*: true"
            "$APKSIGNER" verify "$apk"
          fi
        done

        if [ -n "$AAPT2" ]; then
          for apk in \
            app/build/outputs/apk/prod/release/*universal*.apk \
            app/build/outputs/apk/prod/release/*arm64-v8a*.apk
          do
            [ -f "$apk" ] || continue
            echo "=== aapt2 badging $apk ==="
            "$AAPT2" dump badging "$apk" | head -n 30
          done
        fi

    - name: Prepare Release APKs
      id: prep_release
      run: |
        VERSION=$(grep -oE 'extra\["bitchordVersionName"\]\s*=\s*"[^"]+"' build.gradle.kts | sed -E 's/.*"([^"]+)"/\1/')
        SUFFIX=$(grep -oE 'extra\["bitchordBetaSuffix"\]\s*=\s*"[^"]+"' build.gradle.kts | sed -E 's/.*"([^"]+)"/\1/' || true)
        if [ -n "$SUFFIX" ]; then
          FULL_VERSION="${VERSION}-${SUFFIX}"
          IS_PRERELEASE=true
        else
          FULL_VERSION="${VERSION}"
          IS_PRERELEASE=false
        fi
        TAG="v${FULL_VERSION}"

        rm -rf release-assets
        mkdir -p release-assets

        cp app/build/outputs/apk/prod/release/*universal*.apk "release-assets/Musify-v${FULL_VERSION}.apk"
        for abi in arm64-v8a armeabi-v7a x86_64; do
          f=$(ls app/build/outputs/apk/prod/release/*${abi}*.apk 2>/dev/null | head -n1 || true)
          [ -n "$f" ] && cp "$f" "release-assets/Musify-v${FULL_VERSION}_${abi}.apk"
        done

        TV_UNIV=$(ls tv/build/outputs/apk/prod/release/*universal*.apk 2>/dev/null | head -n1 || true)
        [ -n "$TV_UNIV" ] && cp "$TV_UNIV" "release-assets/MusifyTV-v${FULL_VERSION}.apk"
        for abi in arm64-v8a armeabi-v7a x86_64; do
          f=$(ls tv/build/outputs/apk/prod/release/*${abi}*.apk 2>/dev/null | head -n1 || true)
          [ -n "$f" ] && cp "$f" "release-assets/MusifyTV-v${FULL_VERSION}_${abi}.apk"
        done

        WEAR_APK=$(ls wearos/build/outputs/apk/prod/release/*.apk 2>/dev/null | head -n1 || true)
        [ -n "$WEAR_APK" ] && cp "$WEAR_APK" "release-assets/MusifyWear-v${FULL_VERSION}.apk"

        (cd release-assets && sha256sum *.apk > "Musify-v${FULL_VERSION}-SHA256SUMS.txt")
        ls -lh release-assets/

        echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musify-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload TV APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musify-tv-prod-release-signed
        path: tv/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musify-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.prep_release.outputs.tag }}"
        VERSION="${{ steps.prep_release.outputs.version }}"
        IS_PRE="${{ steps.prep_release.outputs.prerelease }}"
        TITLE="Musify v${VERSION}"
        NOTES_FILE=$(mktemp)
        cat > "$NOTES_FILE" <<EOF
        Signed Android release build from commit \`${GITHUB_SHA::7}\`.

        ### Downloads
        - **Phone (Universal — recommended):** \`Musify-v${VERSION}.apk\`
        - **Phone (Per-ABI splits):** \`Musify-v${VERSION}_arm64-v8a.apk\`, \`Musify-v${VERSION}_armeabi-v7a.apk\`, \`Musify-v${VERSION}_x86_64.apk\`
        - **Android TV:** \`MusifyTV-v${VERSION}.apk\` (plus per-ABI splits)
        - **Wear OS Companion:** \`MusifyWear-v${VERSION}.apk\`
        - **Checksums:** \`Musify-v${VERSION}-SHA256SUMS.txt\`
        EOF

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f "$TAG" "$GITHUB_SHA"
        git push -f origin "refs/tags/$TAG"

        if gh release view "$TAG" >/dev/null 2>&1; then
          if [ "$IS_PRE" = "true" ]; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease --target "$GITHUB_SHA"
          else
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease=false --latest --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" release-assets/* --clobber
        else
          if [ "$IS_PRE" = "true" ]; then
            gh release create "$TAG" release-assets/* --title "$TITLE" --notes-file "$NOTES_FILE" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$TAG" release-assets/* --title "$TITLE" --notes-file "$NOTES_FILE" --latest --target "$GITHUB_SHA"
          fi
        fi
        rm -f "$NOTES_FILE"
