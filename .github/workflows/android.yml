name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "LASTFM_API_KEY=${LASTFM_API_KEY}" > local.properties
        echo "LASTFM_SECRET=${LASTFM_SECRET}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${LISTEN_TOGETHER_SERVER:-https://broker.emqx.io:8883}" >> local.properties

        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > musify-release.jks
          STORE_PASS="$KEYSTORE_PASSWORD"
          ALIAS="$KEY_ALIAS"
          KEY_PASS="$KEY_PASSWORD"
        else
          STORE_PASS="musifyrelease"
          ALIAS="musify"
          KEY_PASS="musifyrelease"
          keytool -genkeypair -v -keystore musify-release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Musify, OU=Mobile, O=Musify, L=Jakarta, S=ID, C=ID"
        fi

        {
          echo "storeFile=musify-release.jks"
          echo "storePassword=$STORE_PASS"
          echo "keyAlias=$ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew :shared:jvmTest :sharedUi:jvmTest testDevDebugUnitTest

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Verify Signed Prod Release APK
      run: |
        ls -lh app/build/outputs/apk/prod/release/*.apk
        UNIV=$(ls app/build/outputs/apk/prod/release/*universal*.apk | head -n1)
        echo "Universal APK: $UNIV"
        unzip -l "$UNIV" | grep -q "resources.arsc"
        unzip -l "$UNIV" | grep -q "AndroidManifest.xml"
        unzip -l "$UNIV" | grep -qE "classes[0-9]*\.dex"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1 || true)
        if [ -n "$APKSIGNER" ]; then
          "$APKSIGNER" verify --verbose "$UNIV"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musify-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musify-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
